<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1f2937" stroke-width="8"/>
  
  <!-- Directed Edges -->
  <path d="M 160 256 L 352 160" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <path d="M 160 256 L 352 352" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <path d="M 352 160 L 352 352" stroke="#64748b" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Initial Arrow -->
  <path d="M 80 256 L 125 256" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  <polygon points="140,256 120,246 120,266" fill="#38bdf8"/>

  <!-- Initial State Node q0 -->
  <circle cx="160" cy="256" r="48" fill="url(#gradBlue)"/>
  <circle cx="160" cy="256" r="48" fill="none" stroke="#7dd3fc" stroke-width="6"/>
  <text x="160" y="266" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">q0</text>

  <!-- Final State Node q1 (double border) -->
  <circle cx="352" cy="160" r="50" fill="url(#gradEmerald)"/>
  <circle cx="352" cy="160" r="50" fill="none" stroke="#6ee7b7" stroke-width="6"/>
  <circle cx="352" cy="160" r="40" fill="none" stroke="#ffffff" stroke-width="4"/>
  <text x="352" y="170" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">q1</text>

  <!-- Trap/Pruned State Node q2 (dashed border) -->
  <circle cx="352" cy="352" r="46" fill="#1e293b"/>
  <circle cx="352" cy="352" r="46" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="10 8"/>
  <text x="352" y="362" font-family="sans-serif" font-size="26" font-weight="bold" fill="#fca5a5" text-anchor="middle">q2</text>
  <line x1="324" y1="324" x2="380" y2="380" stroke="#ef4444" stroke-width="6"/>
</svg>
